<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromebook Filter Sim</title>
<style>
  :root {
    --wall-a: #1f3b73; --wall-b: #5a3f8c; --wall-c: #0f6e7a;
    --win: #ffffff; --chrome: #dee3ea; --tab: #ffffff; --ink: #1f2430; --muted: #616b7c; --line: #d5dbe4;
    --omni: #eef1f5; --panel: #f7f8fb; --shelf: rgba(20, 24, 33, .55);
    --allow: #1e7b34; --allow-bg: #e6f4ea; --restrict: #1a5fb4; --restrict-bg: #e7f0fc;
    --flag: #a35f00; --flag-bg: #fff2dc; --block: #c62828; --block-bg: #fdecea; --accent: #1a73e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --win: #202124; --chrome: #2b2d31; --tab: #35363a; --ink: #e8eaed; --muted: #9aa0a6; --line: #3c4043;
      --omni: #282a2d; --panel: #1b1c1f; --allow-bg: #1d3325; --restrict-bg: #1b2b44; --flag-bg: #3a2c15; --block-bg: #3a1f22;
      --allow: #81c995; --restrict: #8ab4f8; --flag: #fdd663; --block: #f28b82; --accent: #8ab4f8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
    background: radial-gradient(1200px 700px at 15% 10%, var(--wall-c), transparent 60%),
                radial-gradient(900px 700px at 90% 90%, var(--wall-b), transparent 60%), var(--wall-a);
    overflow: hidden;
  }
  .desktop { position: absolute; inset: 0 0 52px 0; padding: 18px; display: flex; gap: 14px; }
  .window {
    flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--win);
    border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08);
  }
  .tabstrip { background: var(--chrome); display: flex; align-items: flex-end; height: 38px; padding: 0 8px; gap: 4px; }
  .tab {
    background: var(--tab); border-radius: 10px 10px 0 0; height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 8px;
    min-width: 0; max-width: 260px; flex: 0 1 260px; font-size: 12.5px;
  }
  .tab .fav { width: 16px; height: 16px; border-radius: 4px; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--muted); }
  .tab .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tab .x { color: var(--muted); }
  .newtab { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); margin-bottom: 2px; }
  .winctl { margin-left: auto; display: flex; gap: 14px; align-self: center; color: var(--muted); font-size: 13px; padding-right: 6px; }
  .toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--tab); border-bottom: 1px solid var(--line); }
  .iconbtn { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; font-size: 16px; flex: none; }
  .iconbtn:hover { background: var(--omni); }
  .iconbtn:disabled { opacity: .35; cursor: default; background: transparent; }
  form.omni { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--omni); border-radius: 999px; padding: 0 14px; height: 36px; border: 2px solid transparent; }
  form.omni:focus-within { border-color: var(--accent); background: var(--win); }
  form.omni input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px; outline: none; }
  .lock { font-size: 13px; color: var(--muted); }
  .managed { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; padding: 0 6px; white-space: nowrap; }
  .viewport { flex: 1; position: relative; background: var(--win); }
  .viewport iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--win); }
  .loading { position: absolute; top: 0; left: 0; height: 3px; background: var(--accent); width: 0; transition: width .6s ease; z-index: 2; }

  /* New tab page */
  .ntp { position: absolute; inset: 0; overflow: auto; padding: 8vh 24px 40px; text-align: center; }
  .ntp .seal { width: 64px; height: 64px; border-radius: 16px; background: #24407a; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 22px; margin: 0 auto 14px; }
  .ntp h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .ntp p { color: var(--muted); margin: 0 0 26px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 820px; margin: 0 auto; }
  .tile { text-align: left; border: 1px solid var(--line); background: var(--win); color: var(--ink); border-radius: 12px; padding: 12px; cursor: pointer; font: inherit; }
  .tile:hover { border-color: var(--accent); }
  .tile b { display: block; font-size: 13px; margin-bottom: 2px; }
  .tile span { color: var(--muted); font-size: 12px; word-break: break-all; }

  /* Inspector */
  .inspector {
    width: 380px; flex: none; background: var(--panel); border-radius: 12px; overflow: auto; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.08);
  }
  .inspector header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .inspector h2 { margin: 0; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .controls label { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .controls select, .controls input[type=text] { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--win); color: var(--ink); }
  .controls .check { flex-direction: row; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink); grid-column: span 2; }
  .controls .full { grid-column: span 2; }
  .section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .section h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px 16px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 3px 8px; border-radius: 999px; }
  .a-allow { color: var(--allow); background: var(--allow-bg); } .a-restrict { color: var(--restrict); background: var(--restrict-bg); }
  .a-flag { color: var(--flag); background: var(--flag-bg); } .a-block { color: var(--block); background: var(--block-bg); }
  .verdict { display: flex; align-items: center; gap: 10px; }
  .verdict .big { font-size: 18px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .vendors a { color: var(--accent); font-size: 12.5px; display: block; margin-top: 4px; text-decoration: none; }
  .vendors a:hover { text-decoration: underline; }
  .listbar { padding: 10px 16px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: auto; }
  .matrix div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 10.5px; color: var(--muted); }
  .matrix div.cur { border-color: var(--accent); }
  .matrix .pill { margin-top: 4px; }
  ul.reasons, ul.sugg { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  ul.reasons li { font-size: 12.5px; display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }
  ul.reasons code { font-size: 11px; color: var(--muted); display: block; }
  ul.sugg li { font-size: 12.5px; padding-left: 14px; position: relative; }
  ul.sugg li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }
  pre { margin: 0; font-size: 11.5px; background: var(--win); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  .copy { font: inherit; font-size: 11px; border: 1px solid var(--line); background: var(--win); color: var(--ink); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); }

  /* Shelf */
  .shelf { position: absolute; left: 0; right: 0; bottom: 0; height: 52px; background: var(--shelf); backdrop-filter: blur(20px); display: flex; align-items: center; padding: 0 12px; gap: 10px; color: #fff; }
  .launcher { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); }
  .launcher::after { content: ""; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%; }
  .apps { flex: 1; display: flex; justify-content: center; gap: 10px; }
  .app { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
  .status { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.12); padding: 6px 12px; border-radius: 999px; font-size: 13px; }
  .toggle-insp { display: none; }

  @media (max-width: 900px) {
    .desktop { padding: 8px; flex-direction: column; }
    .inspector { width: auto; max-height: 45%; }
    .managed span { display: none; }
    .winctl { display: none; }
  }
</style>
</head>
<body>
<div class="desktop">
  <div class="window">
    <div class="tabstrip">
      <div class="tab"><div class="fav" id="fav">·</div><div class="ttl" id="tabTitle">New Tab</div><div class="x">✕</div></div>
      <div class="newtab">＋</div>
      <div class="winctl"><span>—</span><span>▢</span><span>✕</span></div>
    </div>
    <div class="toolbar">
      <button class="iconbtn" id="back" title="Back" disabled>←</button>
      <button class="iconbtn" id="fwd" title="Forward" disabled>→</button>
      <button class="iconbtn" id="reload" title="Reload">⟳</button>
      <button class="iconbtn" id="home" title="Home">⌂</button>
      <form class="omni" id="omni" autocomplete="off">
        <span class="lock" id="lock">🔍</span>
        <input id="url" placeholder="Paste a website, e.g. tiktok.com or http://localhost:3000" spellcheck="false" autofocus>
      </form>
      <div class="managed" title="This device is managed by your school"><span>🏫</span><span>Managed</span></div>
    </div>
    <div class="viewport" id="viewport">
      <div class="loading" id="loading"></div>
      <div class="ntp" id="ntp">
        <div class="seal">WF</div>
        <h1 id="district">School Chromebook</h1>
        <p>Paste any URL into the address bar to see whether a student Chromebook would load it.</p>
        <div class="tiles" id="tiles"></div>
      </div>
      <iframe id="frame" title="Simulated page" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
    </div>
  </div>

  <aside class="inspector" id="inspector">
    <header>
      <h2>Filter Inspector <span class="pill a-allow" id="profileTag">High School</span></h2>
      <div class="controls">
        <label>Policy profile
          <select id="profile">
            <option value="elementary">Elementary (K-5)</option>
            <option value="middle">Middle (6-8)</option>
            <option value="high" selected>High (9-12)</option>
            <option value="staff">Staff / Teacher</option>
            <option value="guest">Guest Wi-Fi</option>
          </select>
        </label>
        <label>Block page style
          <select id="style">
            <option value="filter">District filter</option>
            <option value="chrome">Chrome admin block</option>
          </select>
        </label>
        <label class="full">Evaluate as deployed host (for localhost)
          <input type="text" id="as" placeholder="myapp.vercel.app">
        </label>
        <label class="check"><input type="checkbox" id="deep"> Deep scan: fetch the page, classify content, check domain age</label>
      </div>
    </header>
    <div id="result"><div class="empty">No site checked yet.</div></div>
    <div class="listbar" id="listbar"></div>
  </aside>
</div>

<div class="shelf">
  <div class="launcher"></div>
  <div class="apps">
    <div class="app" style="background:#1a73e8">C</div>
    <div class="app" style="background:#188038">D</div>
    <div class="app" style="background:#f9ab00;color:#202124">S</div>
    <div class="app" style="background:#d93025">K</div>
  </div>
  <div class="status"><span>📶</span><span>🔋 84%</span><span id="clock"></span></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const PROFILE_NAMES = { elementary: "Elementary", middle: "Middle", high: "High", staff: "Staff", guest: "Guest" };
const SAMPLES = [
  ["Khan Academy", "khanacademy.org"], ["Google search", "google.com/search?q=photosynthesis"],
  ["YouTube", "youtube.com/watch?v=dQw4w9WgXcQ"], ["YouTube Shorts", "youtube.com/shorts/abc123"],
  ["TikTok", "tiktok.com"], ["Coolmath Games", "coolmathgames.com"], ["Unblocked games mirror", "unblockedgames76.github.io"],
  ["ChatGPT", "chatgpt.com"], ["Character.AI", "character.ai"], ["Discord", "discord.com/app"],
  ["Shortened link", "bit.ly/3xYz"], ["Translate proxy", "translate.google.com/translate?u=reddit.com"],
  ["chrome://flags", "chrome://flags"], ["Raw IP", "http://142.250.72.14"], ["Your local app", "http://localhost:3000"]
];

const state = { history: [], index: -1, last: null };

function tiles() {
  $("tiles").innerHTML = SAMPLES.map(([t, u]) => `<button class="tile" data-url="${esc(u)}"><b>${esc(t)}</b><span>${esc(u)}</span></button>`).join("");
  $("tiles").onclick = (e) => { const b = e.target.closest(".tile"); if (b) go(b.dataset.url); };
}

function setLoading(on) {
  const bar = $("loading");
  if (on) { bar.style.transition = "none"; bar.style.width = "0"; requestAnimationFrame(() => { bar.style.transition = "width 2s ease"; bar.style.width = "80%"; }); }
  else { bar.style.transition = "width .2s"; bar.style.width = "100%"; setTimeout(() => (bar.style.width = "0"), 250); }
}

function showNtp() {
  $("ntp").hidden = false; $("frame").hidden = true; $("url").value = ""; $("tabTitle").textContent = "New Tab";
  $("fav").textContent = "·"; $("fav").style.background = ""; $("lock").textContent = "🔍";
}

async function go(input, { push = true } = {}) {
  input = String(input || "").trim();
  if (!input) return;
  if (push) { state.history = state.history.slice(0, state.index + 1); state.history.push(input); state.index++; }
  navButtons();
  $("url").value = input;
  setLoading(true);
  const qs = new URLSearchParams({ url: input, profile: $("profile").value, style: $("style").value });
  if ($("deep").checked) qs.set("deep", "1");
  if ($("as").value.trim()) qs.set("as", $("as").value.trim());
  try {
    const res = await fetch(`/api/simulate?${qs}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    state.last = data;
    render(data, qs);
  } catch (err) {
    $("result").innerHTML = `<div class="empty">Error: ${esc(err.message)}</div>`;
  } finally {
    setLoading(false);
  }
}

function navButtons() {
  $("back").disabled = state.index <= 0 && $("ntp").hidden;
  $("fwd").disabled = state.index >= state.history.length - 1;
}

function render({ verdict: v, profiles, page }, qs) {
  $("ntp").hidden = true;
  const frame = $("frame");
  frame.hidden = false;
  frame.srcdoc = page;
  const host = v.host || v.input;
  $("tabTitle").textContent = v.blocked ? `${host} is blocked` : host;
  $("fav").textContent = v.blocked ? "!" : (host[0] || "·").toUpperCase();
  $("fav").style.background = `var(--${v.action})`;
  $("lock").textContent = v.url?.startsWith("https:") ? "🔒" : v.url?.startsWith("http:") ? "⚠︎" : "ⓘ";
  if (v.url) $("url").value = v.url;
  navButtons();

  const cli = ["chromebook-sim check", JSON.stringify(v.input), `--profile ${v.profile}`];
  if (qs.get("deep")) cli.push("--deep");
  if (qs.get("as")) cli.push(`--as ${qs.get("as")}`);
  cli.push("--json");
  const curl = `curl -s '${location.origin}/api/check?${new URLSearchParams([...qs].filter(([k]) => k !== "style"))}'`;

  const content = v.content?.report;
  $("result").innerHTML = `
    <div class="section">
      <div class="verdict"><span class="pill a-${v.action}">${v.action}</span><span class="big">${esc(v.category.name)}</span></div>
      <div class="meta">${esc(v.message)}</div>
      ${v.local ? `<div class="meta">Local URL${v.evaluatedHost !== v.host ? `, evaluated as <b>${esc(v.evaluatedHost)}</b>` : ""}.</div>` : ""}
      <div class="meta">Risk score ${v.riskScore}/100${v.category.cipa ? " · CIPA category" : ""}</div>
    </div>
    <div class="section"><h3>Across policy profiles</h3>
      <div class="matrix">${Object.entries(profiles).map(([p, r]) => `<div class="${p === v.profile ? "cur" : ""}">${PROFILE_NAMES[p]}<br><span class="pill a-${r.action}">${r.action}</span></div>`).join("")}</div>
    </div>
    ${v.enforcement.length ? `<div class="section"><h3>Enforcement</h3><ul class="sugg">${v.enforcement.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
    <div class="section"><h3>Why (${v.reasons.length} rule${v.reasons.length === 1 ? "" : "s"})</h3>
      <ul class="reasons">${v.reasons.map((r) => `<li><span class="pill a-${r.action}">${r.action}</span><div>${esc(r.detail)}<code>${esc(r.code)} · ${esc(r.source)} · ${esc(r.category)}</code></div></li>`).join("")}</ul>
    </div>
    ${content ? `<div class="section"><h3>Page content</h3>
      <div class="meta">HTTP ${v.content.status ?? "n/a"}${v.content.error ? ` · ${esc(v.content.error)}` : ""}${v.content.finalUrl && v.content.finalUrl !== v.url ? ` · redirected to ${esc(v.content.finalUrl)}` : ""}</div>
      <div class="meta">Title: ${esc(content.title || "(none)")}</div>
      <div class="meta">Scores: ${Object.entries(content.scores).map(([k, s]) => `${esc(k)} ${s}`).join(", ") || "none"}</div>
      ${content.signatures.length ? `<div class="meta">Signatures: ${content.signatures.map((s) => esc(s.label)).join("; ")}</div>` : ""}
    </div>` : v.content?.error ? `<div class="section"><h3>Page content</h3><div class="meta">Couldn't fetch: ${esc(v.content.error)}</div></div>` : ""}
    ${v.registration ? `<div class="section"><h3>Domain age</h3><div class="meta">${v.registration.ageDays != null ? `${esc(v.registration.domain)} registered ${esc(v.registration.registeredAt?.slice(0, 10))} · ${v.registration.ageDays} days old` : `${esc(v.registration.domain)}: ${esc(v.registration.error || "unknown")}`}</div></div>` : ""}
    <div class="section"><h3>For developers</h3><ul class="sugg">${v.suggestions.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>
    ${v.vendorLookups?.length && !v.trusted ? `<div class="section vendors"><h3>Check real vendors</h3>${v.vendorLookups.map((l) => `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.vendor)} ↗</a>`).join("")}</div>` : ""}
    <div class="section"><h3>Reproduce <button class="copy" data-copy="cli">copy</button></h3><pre id="cli">${esc(cli.join(" "))}</pre>
      <div style="height:8px"></div><h3>API <button class="copy" data-copy="curl">copy</button></h3><pre id="curl">${esc(curl)}</pre></div>
    <div class="section"><details><summary>Raw verdict JSON</summary><pre>${esc(JSON.stringify(v, null, 2))}</pre></details></div>`;
}

$("result").addEventListener("click", (e) => {
  const b = e.target.closest(".copy");
  if (!b) return;
  navigator.clipboard?.writeText($(b.dataset.copy).textContent);
  b.textContent = "copied"; setTimeout(() => (b.textContent = "copy"), 1200);
});
$("omni").addEventListener("submit", (e) => { e.preventDefault(); go($("url").value); });
$("reload").onclick = () => state.index >= 0 && !$("frame").hidden && go(state.history[state.index], { push: false });
$("home").onclick = () => { showNtp(); navButtons(); };
$("back").onclick = () => {
  if (state.index > 0) { state.index--; go(state.history[state.index], { push: false }); }
  else { showNtp(); navButtons(); }
};
$("fwd").onclick = () => { if (state.index < state.history.length - 1) { state.index++; go(state.history[state.index], { push: false }); } };
window.addEventListener("message", (e) => { if (e.data?.type === "sim-back") $("back").click(); });
for (const id of ["profile", "style", "deep"]) $(id).addEventListener("change", () => {
  $("profileTag").textContent = PROFILE_NAMES[$("profile").value];
  if (state.index >= 0 && !$("frame").hidden) go(state.history[state.index], { push: false });
});

function clock() { $("clock").textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }
clock(); setInterval(clock, 20000);
tiles();
fetch("/api/config").then((r) => r.json()).then((c) => {
  $("district").textContent = c.district;
  const l = c.lists;
  $("listbar").textContent = !l.enabled ? "Blocklists disabled (--no-lists)."
    : l.lists ? `Using built-in rules + ${l.domains.toLocaleString()} domains from ${l.lists} real blocklists (HaGeZi, Block List Project).`
    : "Built-in rules only. Run `chromebook-sim lists update` to add ~600k real blocklist domains.";
}).catch(() => {});
const initial = new URLSearchParams(location.search).get("url");
if (initial) go(initial);
</script>
</body>
</html>
